# Prometheus alerting rules for bitcoinfuzz campaigns.
#
# Alert conditions from proposal §6.3:
# - CampaignCrashed: container stopped unexpectedly
# - NewCrashFound: new crash artefact detected
# - LowExecRate: execution rate below threshold
# - HighMemoryUsage: RSS approaching limit
# - CorpusStalled: no new corpus entries for extended period

groups:
  - name: bitcoinfuzz.alerts
    rules:
      # Unexpected stop only. Clean stop/complete removes the series so
      # this gauge is not left at 0 for user-stopped campaigns.
      - alert: CampaignCrashed
        expr: bitcoinfuzz_container_status{job="orchestrator"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Campaign {{ $labels.target }} ({{ $labels.campaign_id }}) has stopped unexpectedly"
          description: "Container for fuzz target {{ $labels.target }} is no longer running. Check container logs for crash details."

      # New crash artefact found
      - alert: NewCrashFound
        expr: increase(bitcoinfuzz_crash_total{job="orchestrator"}[1m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "New crash found in {{ $labels.target }}"
          description: "A new crash artefact was detected for fuzz target {{ $labels.target }} in campaign {{ $labels.campaign_id }}. Total crashes: {{ $value }}."

      # Execution rate dropped below useful threshold
      - alert: LowExecRate
        expr: bitcoinfuzz_exec_per_second{job="orchestrator"} < 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low execution rate on {{ $labels.target }}: {{ $value }} exec/s"
          description: "Fuzz target {{ $labels.target }} has been running below 100 exec/s for more than 5 minutes. This may indicate resource contention or a stuck fuzzer."

      # Memory usage approaching the campaign's own configured limit.
      # Expressed as a fraction of bitcoinfuzz_memory_limit_mb, which the
      # orchestrator publishes per campaign at launch, so this rule holds
      # no copy of the default and stays correct for campaigns started
      # with a non-default memory_mb. The `> 0` filter drops campaigns
      # with no limit, which publish 0.
      - alert: HighMemoryUsage
        expr: >-
          bitcoinfuzz_rss_mb{job="orchestrator"}
          / on(target, campaign_id)
          (bitcoinfuzz_memory_limit_mb{job="orchestrator"} > 0)
          > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.target }}: {{ $value | humanizePercentage }} of its limit"
          description: "Fuzz target {{ $labels.target }} RSS has been above 90% of the campaign's configured memory limit for 2 minutes. Raise memory_mb on the campaign, or lower the fuzzer's rss_limit_mb so libFuzzer reports an OOM before Docker kills the container."

      # Corpus hasn't grown (coverage may have plateaued)
      - alert: CorpusStalled
        expr: deriv(bitcoinfuzz_corpus_files_total{job="orchestrator"}[30m]) == 0 and bitcoinfuzz_container_status{job="orchestrator"} == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Corpus stalled for {{ $labels.target }}"
          description: "No new corpus entries for fuzz target {{ $labels.target }} in the last hour. Coverage may have plateaued — consider seed rotation or target review."
