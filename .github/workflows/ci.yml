name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

  lint-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check compose file parses
        run: docker compose -f docker-compose.yml config --quiet
        env:
          # Compose interpolates these; dummy values are fine for a parse
          # check. DOCKER_GID and ORCHESTRATOR_API_TOKEN both use the
          # ${VAR:?err} form, so Compose exits non-zero when they are
          # unset. A local run masks that by auto-loading .env, which is
          # gitignored and absent here.
          BITCOINFUZZ_REPO: /tmp/bitcoinfuzz-placeholder
          DOCKER_GID: "999"
          ORCHESTRATOR_API_TOKEN: ci-placeholder-token
